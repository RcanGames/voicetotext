
name: Build VoiceToText Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name VoiceToText
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all av
          main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-Windows
          path: dist/VoiceToText.exe
          if-no-files-found: error
          retention-days: 7
